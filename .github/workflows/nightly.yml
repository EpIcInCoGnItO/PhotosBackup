name: Nightly IPA Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build Unsigned App Binary
        run: |
          xcodebuild -project PhotosBackup.xcodeproj \
            -scheme PhotosBackup \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build \
            CONFIGURATION_BUILD_DIR=build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/*.app Payload/
          zip -r PhotosBackup-Nightly.ipa Payload

      - name: Upload IPA as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotosBackup-Nightly-IPA
          path: PhotosBackup-Nightly.ipa
          retention-days: 7
